name: boraviajar_app
description: Conecte-se com pessoas que planejam a mesma viagem pelo Brasil.
publish_to: "none"
version: 1.0.1+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Navegação ──────────────────────────────────────────────────────────────
  go_router: ^14.6.1

  # ── Estado ─────────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── HTTP ───────────────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Autenticação ───────────────────────────────────────────────────────────
  # Auth0 via OAuth 2.0 / PKCE — abre o browser nativo do sistema
  flutter_appauth: ^8.0.1
  # Armazena o JWT de sessão com segurança (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2

  # ── Push Notifications ─────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ── Imagens ────────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # ── Mapas ──────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.9.0

  # ── Utilitários ────────────────────────────────────────────────────────────
  intl: ^0.19.0 # formatação de datas pt-BR
  shimmer: ^3.0.0 # skeleton loader
  flutter_svg: ^2.0.10
  equatable: ^2.0.5 # comparação de objetos/models
  animated_notch_bottom_bar: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon/app_icon_orange.jpg
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icon/
    - assets/images/destinations/
